<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>部活配車代管理システム</title>

<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6f8;margin:0}
.header{background:#1f4e79;color:#fff;padding:14px;text-align:center;font-weight:bold}
.tabs{display:flex;position:sticky;top:0;background:#fff}
.tab{flex:1;padding:12px;border:none;background:#fff}
.tab.active{background:#1f4e79;color:#fff}
.page{display:none;padding:12px;max-width:480px;margin:auto}
.page.active{display:block}
.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.12)}
table{width:100%;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}
.btn{display:block;width:100%;padding:12px;background:#1f4e79;color:#fff;border:none;border-radius:8px;margin-top:10px}
input{width:70px}
.smallbtn{padding:4px 8px;font-size:12px}
</style>
</head>

<body>

<div class="header">⚾ 配車代管理システム</div>

<div class="tabs">
<button class="tab active" onclick="show('guardian',this)">保護者</button>
<button class="tab" onclick="show('accounting',this)">会計</button>
<button class="tab" onclick="show('admin',this)">管理者</button>
</div>

<!-- 保護者 -->
<div id="guardian" class="page active">
<div class="card" id="summary"></div>
<div class="card">
<table>
<thead>
<tr><th>苗字</th><th>人数</th><th>負担額</th><th>状態</th></tr>
</thead>
<tbody id="guardianTable"></tbody>
</table>
</div>
</div>

<!-- 会計 -->
<div id="accounting" class="page">

<div class="card">
<h3>遠征編集</h3>

距離 <input id="distance" value="30"> km<br><br>
ガソリン単価 <input id="gas" value="170"> 円<br><br>
燃費 <input id="fuel" value="10"> km/L

<button class="btn" onclick="calc()">計算</button>
</div>

<div class="card">
<table>
<thead>
<tr><th>苗字</th><th>人数</th><th>配車</th></tr>
</thead>
<tbody id="accountTable"></tbody>
</table>
</div>

<button class="btn" onclick="makeLine()">LINE共有</button>
<textarea id="line"></textarea>

</div>

<!-- 管理者 -->
<div id="admin" class="page">

<div class="card">
<h3>メンバー追加</h3>
<input id="name" placeholder="苗字">
<input id="num" type="number" placeholder="人数">
<button class="btn" onclick="add()">追加</button>
</div>

<div class="card">
<h3>メンバー一覧</h3>
<ul id="list"></ul>
</div>

</div>

<script>

let db = JSON.parse(localStorage.getItem("car-db") || '{"families":[]}');
let last = null;

function save(){
localStorage.setItem("car-db",JSON.stringify(db));
render();
}

function add(){
const name=document.getElementById("name").value.trim();
const num=Number(document.getElementById("num").value);

if(!name||num<=0)return alert("入力");

db.families.push({
id:Date.now(),
name,
members:num,
car:false,
paid:false
});

save();
}

function toggleCar(id){
db.families=db.families.map(f=>{
if(f.id===id) f.car=!f.car;
return f;
});
save();
}

function togglePaid(id){
db.families=db.families.map(f=>{
if(f.id===id) f.paid=!f.paid;
return f;
});
save();
}

function calc(){

const distance=Number(document.getElementById("distance").value);
const gas=Number(document.getElementById("gas").value);
const fuel=Number(document.getElementById("fuel").value);

if(distance<=0||gas<=0||fuel<=0)return alert("入力");

let total=(distance*gas)/fuel;
total=Math.ceil(total/10)*10;

const people=db.families.reduce((a,b)=>a+b.members,0);
const per=Math.ceil(total/people);

last={total,per};

render();
}

function render(){

// 管理一覧
document.getElementById("list").innerHTML=
db.families.map(f=>
`<li>${f.name}(${f.members})</li>`
).join("");

// 会計表
document.getElementById("accountTable").innerHTML=
db.families.map(f=>
`<tr>
<td>${f.name}</td>
<td>${f.members}</td>
<td><input type="checkbox" ${f.car?'checked':''} onclick="toggleCar(${f.id})"></td>
</tr>`
).join("");

// 保護者
const people=db.families.reduce((a,b)=>a+b.members,0);

document.getElementById("summary").innerHTML=last?
`
<h3>総額 ${last.total}円</h3>
<h2>1人 ${last.per}円</h2>
<p>参加 ${people}人</p>
`:`未計算`;

document.getElementById("guardianTable").innerHTML=
db.families.map(f=>
`<tr>
<td>${f.name}</td>
<td>${f.members}</td>
<td>${last?last.per*f.members+"円":"-"}</td>
<td>
<button class="smallbtn" onclick="togglePaid(${f.id})">
${f.paid?"済":"未"}
</button>
</td>
</tr>`
).join("");
}

function makeLine(){
if(!last)return alert("計算してください");

const people=db.families.reduce((a,b)=>a+b.members,0);

document.getElementById("line").value=
`配車代連絡

1人あたり ${last.per}円
総額 ${last.total}円
参加人数 ${people}人`;
}

function show(id,btn){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
btn.classList.add("active");
}

render();

</script>

</body>
</html>
