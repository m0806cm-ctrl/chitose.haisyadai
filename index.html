<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配車代管理システム v5.0 完全版</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8;}
header{background:#0b3d91;color:#fff;padding:12px;text-align:center;font-weight:bold;}
.container{padding:10px;padding-bottom:90px;}

.card{background:#fff;margin:10px 0;padding:10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}

input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc;}

button{padding:10px;margin:3px;border:none;border-radius:8px;}

.primary{background:#0b3d91;color:#fff;}
.green{background:#2e7d32;color:#fff;}
.red{background:#c62828;color:#fff;}

.tab{display:none;}
.tab.active{display:block;}

.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccc;}
.nav button{flex:1;}

.small{font-size:12px;color:#666;}
hr{border:none;border-top:1px solid #eee;}
</style>
</head>

<body>

<header>配車代管理 v5.0（完全統合版）</header>

<div class="container">

<!-- LOGIN -->
<div id="login" class="tab active">
<h3>ログイン</h3>
<input id="pass" type="password" placeholder="パスワード">
<button class="primary" onclick="login('admin')">管理者</button>
<button class="green" onclick="login('account')">会計</button>
<button onclick="show('parent')">保護者</button>
</div>

<!-- ADMIN -->
<div id="admin" class="tab">

<div class="card">
<h3>家庭マスタ</h3>
<input id="fam" placeholder="苗字">
<button class="primary" onclick="addFamily()">追加</button>
<div id="famList"></div>
</div>

<div class="card">
<h3>会計アカウント</h3>
<input id="accN" placeholder="名前">
<input id="accP" placeholder="パスワード">
<button class="primary" onclick="addAcc()">追加</button>
</div>

</div>

<!-- ACCOUNT -->
<div id="account" class="tab">

<div class="card">
<h3>遠征作成</h3>
<input id="tName" placeholder="遠征名">
<input id="tDate" type="date">

<input id="dist" placeholder="距離">
<input id="gas" placeholder="ガソリン単価">
<input id="fuel" placeholder="燃費">
<input id="cars" placeholder="配車台数">

<button class="primary" onclick="addTrip()">作成</button>
</div>

<div id="tripList"></div>

</div>

<!-- PARENT -->
<div id="parent" class="tab">
<h3>保護者閲覧</h3>
<div id="parentList"></div>
</div>

</div>

<div class="nav">
<button onclick="show('login')">ログイン</button>
<button onclick="show('admin')">管理</button>
<button onclick="show('account')">会計</button>
<button onclick="show('parent')">保護者</button>
</div>

<script>

/* ===== DB固定構造 ===== */

let db = {
adminPass: localStorage.getItem("adminPass") || "1234",
families: JSON.parse(localStorage.getItem("families")||"[]"),
accounts: JSON.parse(localStorage.getItem("accounts")||"[]"),
trips: JSON.parse(localStorage.getItem("trips")||"[]")
};

function save(){
localStorage.setItem("adminPass",db.adminPass);
localStorage.setItem("families",JSON.stringify(db.families));
localStorage.setItem("accounts",JSON.stringify(db.accounts));
localStorage.setItem("trips",JSON.stringify(db.trips));
}

/* ===== NAV ===== */

function show(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

/* ===== LOGIN ===== */

function login(type){
let p=pass.value;
if(type==="admin" && p===db.adminPass) show("admin");
if(type==="account") show("account");
}

/* ===== MASTER ===== */

function addFamily(){
db.families.push(fam.value);
save();render();
}

function addAcc(){
db.accounts.push({name:accN.value,pass:accP.value});
save();render();
}

/* ===== TRIP ===== */

function addTrip(){

db.trips.push({
id:Date.now(),
name:tName.value,
date:tDate.value,

settings:{
dist:+dist.value,
gas:+gas.value,
fuel:+fuel.value,
cars:+cars.value
},

participants: db.families.map(f=>({
name:f,
people:1,
isCar:false,
collected:false
}))
});

save();render();
}

/* ===== CORE CALC ===== */

function calc(t){

let total = Math.ceil(((t.settings.dist*t.settings.gas/t.settings.fuel)*t.settings.cars)/10)*10;

let people = t.participants.reduce((a,b)=>a+b.people,0);

let per = Math.ceil(total/people);

let carCount = t.participants.filter(p=>p.isCar).length || 1;

let carShare = total/carCount;

return {
total,
per,
result: t.participants.map(p=>{

let base = p.people*per;

let diff = p.isCar
? Math.round(carShare-base)
: -base;

return {...p,base,diff};
})
};
}

/* ===== ACTIONS ===== */

function toggleCar(tid,name){
let t=db.trips.find(x=>x.id===tid);
let p=t.participants.find(x=>x.name===name);
p.isCar=!p.isCar;
save();render();
}

function plus(tid,name){
let t=db.trips.find(x=>x.id===tid);
let p=t.participants.find(x=>x.name===name);
p.people++;
save();render();
}

function minus(tid,name){
let t=db.trips.find(x=>x.id===tid);
let p=t.participants.find(x=>x.name===name);
p.people=Math.max(1,p.people-1);
save();render();
}

/* ===== RENDER ===== */

function render(){

famList.innerHTML=db.families.map(f=>`<div>${f}</div>`).join("");

tripList.innerHTML=db.trips.map(t=>{
let c=calc(t);

return `
<div class="card">
<h3>${t.name}</h3>
総額:${c.total}円 / 1人:${c.per}

<hr>

${c.result.map(p=>{

let d=p.diff>=0?`＋${p.diff}円受取`:`－${Math.abs(p.diff)}円支払`;

return `
<div class="card">
<b>${p.name}</b> ${p.isCar?'🚗':''}<br>
人数:${p.people}<br>
負担:${p.base}円<br>
差分:${d}<br>

<button onclick="plus(${t.id},'${p.name}')">＋</button>
<button onclick="minus(${t.id},'${p.name}')">－</button>
<button onclick="toggleCar(${t.id},'${p.name}')">配車</button>
</div>`;
}).join("")}

</div>`;
}).join("");

parentList.innerHTML=db.trips.map(t=>{
let c=calc(t);
return `<div class="card">${t.name} / ${c.total}円 / ${c.per}円</div>`;
}).join("");

}

render();

</script>

</body>
</html>
