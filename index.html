<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>部活配車代管理システム 完成版</title>
<style>
body{font-family:sans-serif;margin:0;background:#f5f5f5}
header{background:#1f4e79;color:#fff;padding:12px;text-align:center}
.tabs{display:flex}.tabs button{flex:1;padding:12px;border:0}
.active{background:#1f4e79;color:#fff}
.page{display:none;padding:12px}.show{display:block}
.card{background:#fff;padding:12px;border-radius:8px;margin:10px 0}
input,textarea,select{width:100%;padding:8px;margin:4px 0}
table{width:100%;border-collapse:collapse}
td,th{border-bottom:1px solid #ddd;padding:6px}
button{padding:8px}
</style></head><body>
<header>部活配車代管理システム</header>

<div class="tabs">
<button class="active" onclick="tab('admin',this)">管理者</button>
<button onclick="tab('acct',this)">会計</button>
<button onclick="tab('parent',this)">保護者</button>
</div>

<div id="admin" class="page show">
<div class="card">
<h3>家庭マスタ</h3>
<input id="familyName" placeholder="苗字">
<button onclick="addFamily()">追加</button>
<div id="familyList"></div>
</div>
<div class="card">
<h3>会計担当</h3>
<input id="accountantName" placeholder="会計担当名">
<button onclick="addAccountant()">追加</button>
<div id="accountantList"></div>
</div>
</div>

<div id="acct" class="page">
<div class="card">
<h3>遠征作成</h3>
<input id="tripName" placeholder="遠征名">
<input id="tripDate" type="date">
<input id="distance" type="number" placeholder="往復距離(km)">
<input id="gas" type="number" placeholder="ガソリン単価">
<input id="fuel" type="number" placeholder="燃費">
<input id="cars" type="number" value="1" placeholder="配車台数">
<button onclick="addTrip()">遠征作成</button>
</div>
<div class="card">
<select id="tripSelect" onchange="selectTrip()"></select>
<div id="tripEditor"></div>
</div>
</div>

<div id="parent" class="page">
<div class="card">
<select id="parentTrip" onchange="renderParent()"></select>
<div id="parentView"></div>
</div>
</div>

<script>
let db=JSON.parse(localStorage.getItem("club-haisha")||'{"families":[],"accountants":[],"trips":[]}');
let currentTrip=null;
function save(){localStorage.setItem("club-haisha",JSON.stringify(db));render();}
function tab(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}

function addFamily(){let n=familyName.value.trim(); if(!n)return; db.families.push({id:Date.now(),name:n}); familyName.value=''; save();}
function delFamily(id){db.families=db.families.filter(f=>f.id!==id); save();}
function addAccountant(){let n=accountantName.value.trim(); if(!n)return; db.accountants.push({id:Date.now(),name:n}); accountantName.value=''; save();}
function delAccountant(id){db.accountants=db.accountants.filter(a=>a.id!==id); save();}

function addTrip(){
let t={id:Date.now(),name:tripName.value,date:tripDate.value,distance:+distance.value,gas:+gas.value,fuel:+fuel.value,cars:+cars.value,participants:[]};
db.trips.push(t); currentTrip=t.id; save();
}

function selectTrip(){currentTrip=+tripSelect.value; render();}
function toggleJoin(fid,ch){
let t=db.trips.find(x=>x.id===currentTrip); if(!t)return;
let p=t.participants.find(x=>x.familyId===fid);
if(ch && !p)t.participants.push({familyId:fid,members:1,car:false,paid:false});
if(!ch)t.participants=t.participants.filter(x=>x.familyId!==fid);
save();
}
function upd(fid,key,val){
let t=db.trips.find(x=>x.id===currentTrip);
let p=t.participants.find(x=>x.familyId===fid);
if(!p)return;
p[key]=val; save();
}
function calc(t){
let total=((t.distance*t.gas)/t.fuel)*t.cars||0;
total=Math.ceil(total/10)*10;
let people=t.participants.reduce((a,b)=>a+(+b.members||0),0);
let per=people?Math.ceil(total/people):0;
return {total,per};
}
function render(){
familyList.innerHTML=db.families.map(f=>`<div>${f.name} <button onclick="delFamily(${f.id})">削除</button></div>`).join('');
accountantList.innerHTML=db.accountants.map(a=>`<div>${a.name} <button onclick="delAccountant(${a.id})">削除</button></div>`).join('');

tripSelect.innerHTML='<option value="">遠征選択</option>'+db.trips.map(t=>`<option value="${t.id}" ${t.id===currentTrip?'selected':''}>${t.date||''} ${t.name}</option>`).join('');
parentTrip.innerHTML=tripSelect.innerHTML;

let t=db.trips.find(x=>x.id===currentTrip);
if(t){
let r=calc(t);
tripEditor.innerHTML=`<h3>${t.name}</h3>
<table><tr><th>家庭</th><th>参加</th><th>人数</th><th>配車</th><th>集金</th></tr>
${db.families.map(f=>{
let p=t.participants.find(x=>x.familyId===f.id);
return `<tr>
<td>${f.name}</td>
<td><input type="checkbox" ${p?'checked':''} onchange="toggleJoin(${f.id},this.checked)"></td>
<td><input type="number" value="${p?p.members:1}" onchange="upd(${f.id},'members',+this.value)"></td>
<td><input type="checkbox" ${p&&p.car?'checked':''} onchange="upd(${f.id},'car',this.checked)"></td>
<td><input type="checkbox" ${p&&p.paid?'checked':''} onchange="upd(${f.id},'paid',this.checked)"></td>
</tr>`}).join('')}</table>
<p>総額:${r.total}円 / 1人:${r.per}円</p>`;
}
renderParent();
}
function renderParent(){
let id=+parentTrip.value;
let t=db.trips.find(x=>x.id===id);
if(!t){parentView.innerHTML='遠征を選択';return;}
let r=calc(t);
parentView.innerHTML=`<h3>${t.name}</h3><p>総額 ${r.total}円 / 1人 ${r.per}円</p>
<table><tr><th>家庭</th><th>人数</th><th>金額</th><th>状態</th></tr>
${t.participants.map(p=>{
let f=db.families.find(x=>x.id===p.familyId);
return `<tr><td>${f?f.name:''}</td><td>${p.members}</td><td>${p.members*r.per}円</td><td>${p.paid?'済':'未'}</td></tr>`
}).join('')}</table>`;
}
render();
</script></body></html>
