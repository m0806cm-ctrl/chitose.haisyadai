<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千年ドルフィンズ女子 配車代管理システム</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#f4f6f8;
padding-bottom:100px;
}

header{
background:#0b3d91;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
z-index:10;
}

.container{
padding:12px;
max-width:900px;
margin:auto;
}

.card{
background:#fff;
padding:15px;
margin-bottom:12px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2,h3{
margin-bottom:10px;
}

input,select{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
border:none;
border-radius:8px;
padding:10px 14px;
cursor:pointer;
margin:3px;
font-size:15px;
}

.primary{
background:#0b3d91;
color:#fff;
}

.green{
background:#2e7d32;
color:#fff;
}

.red{
background:#c62828;
color:#fff;
}

.orange{
background:#ef6c00;
color:#fff;
}

.gray{
background:#666;
color:#fff;
}

.familyRow{
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
border-bottom:1px solid #eee;
}

.resultPlus{
color:#2e7d32;
font-weight:bold;
}

.resultMinus{
color:#c62828;
font-weight:bold;
}

.hidden{
display:none;
}

.badge{
display:inline-block;
padding:4px 8px;
border-radius:6px;
background:#e8f0ff;
margin-left:5px;
font-size:12px;
}

.progress{
height:20px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:5px;
}

.progressBar{
height:100%;
background:#2e7d32;
text-align:center;
color:#fff;
font-size:12px;
}

@media(max-width:600px){
button{
width:100%;
margin-top:5px;
}
}
</style>
</head>
<body>

<header>
千年ドルフィンズ女子 配車代管理システム
</header>

<div class="container">

<div id="setupCard" class="card hidden">
<h2>初回管理者設定</h2>
<input id="adminPass" type="password" placeholder="管理者パスワード">
<button class="primary" onclick="saveAdmin()">管理者登録</button>
</div>

<div id="loginCard" class="card hidden">
<h2>ログイン</h2>
<select id="loginRole">
<option value="admin">管理者</option>
<option value="account">会計</option>
</select>

<input id="loginPass" type="password" placeholder="パスワード">

<button class="primary" onclick="login()">ログイン</button>
</div>

<div id="mainArea" class="hidden">

<div class="card">
<h2>ユーザー情報</h2>
<div id="roleInfo"></div>
<button class="red" onclick="logout()">ログアウト</button>
</div>

<div id="adminArea" class="hidden">

<div class="card">
<h2>会計アカウント管理</h2>

<input id="accountName" placeholder="会計名">

<input id="accountPass" placeholder="パスワード">

<button class="green" onclick="addAccount()">
会計追加
</button>

<div id="accountList"></div>
</div>

<div class="card">
<h2>家庭マスタ管理</h2>

<input id="familyMasterName" placeholder="家庭名">

<button class="green" onclick="addFamilyMaster()">
家庭追加
</button>

<div id="familyMasterList"></div>
</div>

<div class="card">
<h2>CSVバックアップ</h2>

<button class="green" onclick="exportCSV()">
CSV出力
</button>

<input type="file" id="csvImport" accept=".csv">

<button class="orange" onclick="importCSV()">
CSV復元
</button>

</div>

</div>

<div class="card">
<h2>大会入力</h2>

<input id="tripName" placeholder="大会名">

<input id="tripDate" type="date">

<label>ガソリン単価</label>
<input id="gasPrice" type="number" value="180">

<label>燃費(km/L)</label>
<input id="fuelRate" type="number" value="12">

<label>往復距離(km)</label>
<input id="distance" type="number">

<label>配車台数</label>
<input id="carCount" type="number" value="1">

<button class="primary" onclick="generateFamilies()">
参加家庭作成
</button>

</div>

<div class="card">
<h2>参加家庭設定</h2>

<div id="tripFamilies"></div>

</div>

<div class="card">
<button class="green" onclick="calculate()">
精算計算
</button>
</div>

<div id="resultArea"></div>

<div class="card">
<h2>遠征履歴</h2>
<div id="historyList"></div>
</div>

<div class="card">
<button class="green" onclick="shareLine()">
LINE共有
</button>
</div>

</div>

</div>

<script>

let role=null;

let familyMaster=
JSON.parse(localStorage.getItem("familyMaster")||"[]");

let accounts=
JSON.parse(localStorage.getItem("accounts")||"[]");

let histories=
JSON.parse(localStorage.getItem("histories")||"[]");

let tripFamilies=[];

function saveAll(){
localStorage.setItem("familyMaster",JSON.stringify(familyMaster));
localStorage.setItem("accounts",JSON.stringify(accounts));
localStorage.setItem("histories",JSON.stringify(histories));
}

function init(){

if(!localStorage.getItem("adminPassword")){
document.getElementById("setupCard").classList.remove("hidden");
}else{
document.getElementById("loginCard").classList.remove("hidden");
}

renderFamilyMaster();
renderAccounts();
renderHistory();

}

function saveAdmin(){

let pass=
document.getElementById("adminPass").value;

if(!pass)return;

localStorage.setItem("adminPassword",pass);

alert("管理者作成完了");

location.reload();

}

function login(){

let pass=
document.getElementById("loginPass").value;

let type=
document.getElementById("loginRole").value;

if(type==="admin"){

if(pass!==localStorage.getItem("adminPassword")){
alert("パスワード違い");
return;
}

role="admin";

}else{

let acc=
accounts.find(a=>a.pass===pass);

if(!acc){
alert("パスワード違い");
return;
}

role="account";

}

document.getElementById("loginCard").classList.add("hidden");
document.getElementById("mainArea").classList.remove("hidden");

if(role==="admin"){
document.getElementById("adminArea").classList.remove("hidden");
}

document.getElementById("roleInfo").innerHTML=
"権限 : "+role;

}

function logout(){
location.reload();
}

function addAccount(){

let name=
document.getElementById("accountName").value;

let pass=
document.getElementById("accountPass").value;

if(!name||!pass)return;

accounts.push({
name:name,
pass:pass
});

saveAll();

renderAccounts();

}

function renderAccounts(){

let html="";

accounts.forEach((a,i)=>{

html+=`
<div class="familyRow">
${a.name}
<button class="red"
onclick="deleteAccount(${i})">
削除
</button>
</div>
`;

});

document.getElementById("accountList").innerHTML=html;

}

function deleteAccount(i){

accounts.splice(i,1);

saveAll();

renderAccounts();

}

function addFamilyMaster(){

let name=
document.getElementById("familyMasterName").value;

if(!name)return;

familyMaster.push(name);

saveAll();

renderFamilyMaster();

}

function renderFamilyMaster(){

let html="";

familyMaster.forEach((f,i)=>{

html+=`
<div class="familyRow">
${f}
<button class="red"
onclick="deleteFamilyMaster(${i})">
削除
</button>
</div>
`;

});

document.getElementById("familyMasterList").innerHTML=html;

}

function deleteFamilyMaster(i){

familyMaster.splice(i,1);

saveAll();

renderFamilyMaster();

}

function generateFamilies(){

tripFamilies=[];

familyMaster.forEach(name=>{

tripFamilies.push({
name:name,
people:1,
driver:false,
paid:false
});

});

renderTripFamilies();

}

function renderTripFamilies(){

let html="";

tripFamilies.forEach((f,i)=>{

html+=`

<div class="card">

<b>${f.name}</b>

<label>
<input type="checkbox"
${f.driver?"checked":""}
onchange="toggleDriver(${i},this.checked)">
配車家庭
</label>

<label>参加人数</label>

<input
type="number"
value="${f.people}"
onchange="setPeople(${i},this.value)">

<label>
<input type="checkbox"
${f.paid?"checked":""}
onchange="togglePaid(${i},this.checked)">
入金済
</label>

</div>

`;

});

document.getElementById("tripFamilies").innerHTML=html;

}

function toggleDriver(i,v){
tripFamilies[i].driver=v;
}

function setPeople(i,v){
tripFamilies[i].people=Number(v);
}

function togglePaid(i,v){
tripFamilies[i].paid=v;
}

function calculate(){

let gasPrice=
Number(document.getElementById("gasPrice").value);

let fuelRate=
Number(document.getElementById("fuelRate").value);

let distance=
Number(document.getElementById("distance").value);

let carCount=
Number(document.getElementById("carCount").value);

let gasCost=
Math.round(
(distance/fuelRate)*gasPrice
);

let totalCost=
gasCost*carCount;

let chargePeople=0;

tripFamilies.forEach(f=>{

if(f.driver){
chargePeople+=Math.max(
0,
f.people-1
);
}else{
chargePeople+=f.people;
}

});

if(chargePeople<=0){
alert("人数不足");
return;
}

let unit=
Math.ceil(
totalCost/
chargePeople
);

let driverCount=
tripFamilies.filter(f=>f.driver).length;

let dividend=
driverCount>0
? Math.round(totalCost/driverCount)
:0;

let paidCount=
tripFamilies.filter(f=>f.paid).length;

let rate=
tripFamilies.length===0
?0
:Math.round(
paidCount/
tripFamilies.length*100
);

let html=`

<div class="card">

<h2>精算結果</h2>

大会：
${document.getElementById("tripName").value}<br>

総額：
${totalCost}円<br>

負担人数：
${chargePeople}人<br>

1人あたり：
${unit}円<br>

集金率：
${rate}%

<div class="progress">
<div class="progressBar"
style="width:${rate}%">
${rate}%
</div>
</div>

</div>

`;

tripFamilies.forEach(f=>{

let chargePeopleFamily=
f.driver
? Math.max(0,f.people-1)
: f.people;

let burden=
chargePeopleFamily*unit;

let result=
f.driver
? dividend-burden
: burden*-1;

html+=`

<div class="card">

<b>${f.name}</b><br>

参加人数：
${f.people}人<br>

配車：
${f.driver?"あり":"なし"}<br>

負担額：
${burden}円<br>

`;

if(result>=0){

html+=`
<span class="resultPlus">
受取 ${result}円
</span>
`;

}else{

html+=`
<span class="resultMinus">
支払 ${Math.abs(result)}円
</span>
`;

}

html+=`
</div>
`;

});

document.getElementById("resultArea").innerHTML=html;

histories.unshift({

date:
document.getElementById("tripDate").value,

name:
document.getElementById("tripName").value,

total:totalCost

});

saveAll();

renderHistory();

}

function renderHistory(){

let html="";

histories.forEach(h=>{

html+=`
<div class="familyRow">
${h.date}
${h.name}
<span class="badge">
${h.total}円
</span>
</div>
`;

});

document.getElementById("historyList").innerHTML=html;

}

function shareLine(){

let text=
document.getElementById("resultArea").innerText;

window.open(
"https://line.me/R/msg/text/?"+
encodeURIComponent(text)
);

}

function exportCSV(){

let rows=[
["家庭名"]
];

familyMaster.forEach(f=>{
rows.push([f]);
});

let csv=
rows.map(r=>r.join(","))
.join("\n");

let blob=
new Blob(
[csv],
{type:"text/csv"}
);

let a=
document.createElement("a");

a.href=
URL.createObjectURL(blob);

a.download=
"family_master.csv";

a.click();

}

function importCSV(){

let file=
document.getElementById("csvImport").files[0];

if(!file)return;

let reader=
new FileReader();

reader.onload=function(){

let lines=
reader.result.split(/\r?\n/);

familyMaster=[];

lines.slice(1).forEach(line=>{

let cols=line.split(",");

if(cols[0]){
familyMaster.push(cols[0]);
}

});

saveAll();

renderFamilyMaster();

alert("復元完了");

};

reader.readAsText(file);

}

init();

</script>

</body>
  </html>
