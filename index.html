<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千年ドルフィンズ女子 配車代管理 v7.0</title>
<style>
body{font-family:Arial,sans-serif;margin:20px;background:#f4f6f8}
.card{background:#fff;padding:15px;border-radius:10px}
.green{color:green;font-weight:bold}
.red{color:red;font-weight:bold}
button{padding:10px}
</style>
</head>
<body>
<div class="card">
<h2>千年ドルフィンズ女子 配車代管理 v7.0</h2>
<p>v7.0設計版</p>

<h3>C方式差額計算</h3>

負担額 <input id="charge" type="number"><br><br>
配車代実費 <input id="cost" type="number"><br><br>

<button onclick="calc()">計算</button>

<div id="result"></div>

<hr>

<button onclick="shareLine()">LINE共有</button>
</div>

<script>
function calc(){
 const charge = Number(document.getElementById('charge').value||0);
 const cost = Number(document.getElementById('cost').value||0);

 const diff = cost - charge;

 const result = document.getElementById('result');

 if(diff >= 0){
   result.innerHTML = '<p class="green">受取 ' + diff + '円</p>';
 }else{
   result.innerHTML = '<p class="red">支払 ' + Math.abs(diff) + '円</p>';
 }
}

function shareLine(){
 const text = document.getElementById('result').innerText || '精算結果';
 window.open('https://line.me/R/msg/text/?' + encodeURIComponent(text));
}
</script>
</body>
</html>
