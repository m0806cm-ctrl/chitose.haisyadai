<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配車代管理システム v2</title>
<style>
body{font-family:sans-serif;margin:0;background:#f3f4f6}
header{background:#1f4e79;color:#fff;padding:12px;text-align:center}
.tabs{display:flex}.tabs button{flex:1;padding:12px;border:0}
.active{background:#1f4e79;color:#fff}.page{display:none;padding:12px}.show{display:block}
.card{background:#fff;padding:12px;border-radius:8px;margin:10px 0}
input,select,textarea{width:100%;padding:8px;margin:4px 0;box-sizing:border-box}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:6px}
button{padding:8px;margin:2px}
</style></head><body>
<header>部活配車代管理システム v2</header>

<div class="tabs">
<button class="active" onclick="tab('admin',this)">管理者</button>
<button onclick="tab('acct',this)">会計</button>
<button onclick="tab('parent',this)">保護者</button>
</div>

<div id="admin" class="page show">
<div class="card"><h3>家庭マスタ</h3>
<input id="familyName" placeholder="苗字"><button onclick="addFamily()">追加</button>
<div id="familyList"></div></div>
<div class="card"><h3>会計担当</h3>
<input id="accName" placeholder="会計担当名"><button onclick="addAcc()">追加</button>
<div id="accList"></div></div>
</div>

<div id="acct" class="page">
<div class="card">
<h3>遠征作成/編集</h3>
<input id="tripName" placeholder="遠征名">
<input id="tripDate" type="date">
<input id="distance" type="number" placeholder="往復距離">
<input id="gas" type="number" placeholder="ガソリン単価">
<input id="fuel" type="number" placeholder="燃費">
<input id="cars" type="number" value="1" placeholder="配車台数">
<button onclick="saveTrip()">保存</button>
</div>

<div class="card">
<h3>遠征履歴</h3>
<div id="tripList"></div>
</div>

<div class="card">
<select id="tripSelect" onchange="openTrip()"></select>
<div id="editor"></div>
</div>
</div>

<div id="parent" class="page">
<div class="card">
<select id="parentTrip" onchange="renderParent()"></select>
<div id="parentView"></div>
</div>
</div>

<script>
let db=JSON.parse(localStorage.getItem("haisha-v2")||'{"families":[],"accountants":[],"trips":[]}');
let current=null;
function save(){localStorage.setItem("haisha-v2",JSON.stringify(db));render();}
function tab(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));document.getElementById(id).classList.add('show');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');}

function addFamily(){if(!familyName.value.trim())return;db.families.push({id:Date.now(),name:familyName.value.trim()});familyName.value='';save();}
function delFamily(id){db.families=db.families.filter(x=>x.id!==id);save();}
function addAcc(){if(!accName.value.trim())return;db.accountants.push({id:Date.now(),name:accName.value.trim()});accName.value='';save();}
function delAcc(id){db.accountants=db.accountants.filter(x=>x.id!==id);save();}

function saveTrip(){
if(current){
let t=db.trips.find(x=>x.id===current);
Object.assign(t,{name:tripName.value,date:tripDate.value,distance:+distance.value,gas:+gas.value,fuel:+fuel.value,cars:+cars.value});
}else{
db.trips.push({id:Date.now(),name:tripName.value,date:tripDate.value,distance:+distance.value,gas:+gas.value,fuel:+fuel.value,cars:+cars.value,participants:[]});
}
current=null;clearTripForm();save();
}
function clearTripForm(){tripName.value='';tripDate.value='';distance.value='';gas.value='';fuel.value='';cars.value=1;}
function editTrip(id){let t=db.trips.find(x=>x.id===id);current=id;tripName.value=t.name;tripDate.value=t.date;distance.value=t.distance;gas.value=t.gas;fuel.value=t.fuel;cars.value=t.cars;}
function deleteTrip(id){if(confirm('削除しますか？')){db.trips=db.trips.filter(x=>x.id!==id);if(current===id)current=null;save();}}

function openTrip(){current=+tripSelect.value;render();}
function toggleFamily(fid,checked){
let t=db.trips.find(x=>x.id===current); if(!t)return;
let p=t.participants.find(x=>x.familyId===fid);
if(checked&&!p)t.participants.push({familyId:fid,members:1,car:false,paid:false});
if(!checked)t.participants=t.participants.filter(x=>x.familyId!==fid);
save();
}
function upd(fid,key,val){let t=db.trips.find(x=>x.id===current);let p=t.participants.find(x=>x.familyId===fid);if(p){p[key]=val;save();}}
function calc(t){let total=((t.distance*t.gas)/Math.max(t.fuel||1,1))*t.cars;total=Math.ceil(total/10)*10;let ppl=t.participants.reduce((a,b)=>a+(+b.members||0),0);return {total:Math.round(total),per:ppl?Math.ceil(total/ppl):0};}
function shareLine(){
let t=db.trips.find(x=>x.id===current); if(!t)return;
let r=calc(t); let txt=`${t.name}\n総額:${r.total}円\n1人:${r.per}円\n\n`;
t.participants.forEach(p=>{let f=db.families.find(x=>x.id===p.familyId);txt+=`${f.name}:${p.members*r.per}円\n`;});
window.open('https://line.me/R/msg/text/?'+encodeURIComponent(txt));
}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)]));a.download='backup.json';a.click();}

function render(){
familyList.innerHTML=db.families.map(f=>`<div>${f.name} <button onclick="delFamily(${f.id})">削除</button></div>`).join('');
accList.innerHTML=db.accountants.map(a=>`<div>${a.name} <button onclick="delAcc(${a.id})">削除</button></div>`).join('');
tripList.innerHTML=db.trips.map(t=>`<div>${t.date||''} ${t.name} <button onclick="editTrip(${t.id})">編集</button><button onclick="deleteTrip(${t.id})">削除</button></div>`).join('');
let opts='<option value="">遠征選択</option>'+db.trips.map(t=>`<option value="${t.id}" ${t.id===current?'selected':''}>${t.name}</option>`).join('');
tripSelect.innerHTML=opts; parentTrip.innerHTML=opts;

let t=db.trips.find(x=>x.id===current);
if(t){
let r=calc(t);
editor.innerHTML=`<button onclick="shareLine()">LINE共有</button><button onclick="backup()">JSONバックアップ</button>
<p>総額:${r.total}円 1人:${r.per}円</p>
<table><tr><th>家庭</th><th>参加</th><th>人数</th><th>配車</th><th>集金</th></tr>
${db.families.map(f=>{let p=t.participants.find(x=>x.familyId===f.id);return `<tr>
<td>${f.name}</td>
<td><input type='checkbox' ${p?'checked':''} onchange='toggleFamily(${f.id},this.checked)'></td>
<td><input type='number' value='${p?p.members:1}' onchange='upd(${f.id},"members",+this.value)'></td>
<td><input type='checkbox' ${p&&p.car?'checked':''} onchange='upd(${f.id},"car",this.checked)'></td>
<td><input type='checkbox' ${p&&p.paid?'checked':''} onchange='upd(${f.id},"paid",this.checked)'></td>
</tr>`}).join('')}</table>`;
}
renderParent();
}
function renderParent(){
let id=+parentTrip.value; let t=db.trips.find(x=>x.id===id);
if(!t){parentView.innerHTML='遠征を選択';return;}
let r=calc(t);
parentView.innerHTML=`<h3>${t.name}</h3><p>総額:${r.total}円 1人:${r.per}円</p>
<table><tr><th>家庭</th><th>人数</th><th>金額</th><th>集金</th></tr>
${t.participants.map(p=>{let f=db.families.find(x=>x.id===p.familyId);return `<tr><td>${f.name}</td><td>${p.members}</td><td>${p.members*r.per}円</td><td>${p.paid?'済':'未'}</td></tr>`}).join('')}</table>`;
}
render();
</script></body></html>
