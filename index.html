<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>部活配車代管理システム</title>

<style>
*{box-sizing:border-box}
body{
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    margin:0;
    background:#f5f5f5;
}

header{
    background:#2563eb;
    color:white;
    padding:16px;
    text-align:center;
}

.tabs{
    display:flex;
}

.tabs button{
    flex:1;
    border:none;
    padding:14px;
    background:#ddd;
    font-size:15px;
}

.tabs button.active{
    background:white;
    font-weight:bold;
}

.page{
    display:none;
    padding:15px;
}

.page.active{
    display:block;
}

.card{
    background:white;
    padding:12px;
    border-radius:10px;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:10px;
}

button{
    cursor:pointer;
}

.primary{
    width:100%;
    padding:12px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:8px;
}

.danger{
    background:#dc2626;
    color:white;
    border:none;
    padding:6px 10px;
    border-radius:6px;
}

.result{
    font-size:18px;
    font-weight:bold;
}

textarea{
    width:100%;
    height:120px;
}

.family-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}
</style>
</head>
<body>

<header>
<h2>部活配車代管理システム</h2>
</header>

<div class="tabs">
<button class="tab active" onclick="showPage('parent',this)">保護者</button>
<button class="tab" onclick="showPage('accounting',this)">会計</button>
<button class="tab" onclick="showPage('admin',this)">管理者</button>
</div>

<!-- 保護者 -->
<div id="parent" class="page active">

<div class="card">
<h3>保護者画面</h3>
<div id="parentView">
まだ計算されていません
</div>
</div>

</div>

<!-- 会計 -->
<div id="accounting" class="page">

<div class="card">
<h3>遠征情報</h3>

<input id="tripName" placeholder="遠征名">

<input id="distance" type="number" placeholder="距離(km)">

<input id="gasPrice" type="number" placeholder="ガソリン単価(円)">

<input id="fuel" type="number" placeholder="燃費(km/L)">

<input id="carCount" type="number" value="1" placeholder="配車台数">

<input id="participants" type="number" placeholder="参加人数">

<h4>配車家庭</h4>
<div id="driverFamilies"></div>

<button class="primary" onclick="calculate()">
計算
</button>

</div>

<div class="card">

<div id="result"></div>

</div>

<div class="card">

<button class="primary" onclick="generateLineText()">
LINE共有文生成
</button>

<textarea id="lineText"></textarea>

</div>

</div>

<!-- 管理者 -->
<div id="admin" class="page">

<div class="card">

<h3>家庭追加</h3>

<input id="familyName" placeholder="苗字">

<input id="familyMembers" type="number" placeholder="人数">

<button class="primary" onclick="addFamily()">
家庭追加
</button>

</div>

<div class="card">

<h3>家庭一覧</h3>

<div id="familyList"></div>

</div>

<div class="card">

<button class="primary" onclick="exportJson()">
JSONバックアップ
</button>

<br><br>

<input type="file" onchange="importJson(event)">

</div>

</div>

<script>

let db = JSON.parse(
localStorage.getItem("haisyadai-db") ||
'{"families":[]}'
);

function save(){
localStorage.setItem(
"haisyadai-db",
JSON.stringify(db)
);
renderFamilies();
}

function showPage(id,btn){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

btn.classList.add("active");
}

function addFamily(){

const name =
document.getElementById("familyName").value.trim();

const members =
Number(document.getElementById("familyMembers").value);

if(!name || members<=0){
alert("入力してください");
return;
}

db.families.push({
id:Date.now(),
name,
members
});

document.getElementById("familyName").value="";
document.getElementById("familyMembers").value="";

save();
}

function deleteFamily(id){

if(!confirm("削除しますか？")) return;

db.families =
db.families.filter(f=>f.id!==id);

save();
}

function renderFamilies(){

document.getElementById("familyList").innerHTML =
db.families.map(f=>`
<div class="family-row">
<div>${f.name} (${f.members}人)</div>
<button class="danger"
onclick="deleteFamily(${f.id})">
削除
</button>
</div>
`).join("");

document.getElementById("driverFamilies").innerHTML =
db.families.map(f=>`
<label>
<input type="checkbox"
value="${f.id}">
${f.name}
</label><br>
`).join("");
}

function calculate(){

const tripName =
document.getElementById("tripName").value;

const distance =
Number(document.getElementById("distance").value);

const gasPrice =
Number(document.getElementById("gasPrice").value);

const fuel =
Number(document.getElementById("fuel").value);

const carCount =
Number(document.getElementById("carCount").value);

const participants =
Number(document.getElementById("participants").value);

if(
distance<=0 ||
gasPrice<=0 ||
fuel<=0 ||
carCount<=0 ||
participants<=0
){
alert("数値を入力してください");
return;
}

const oneCar =
(distance * gasPrice) / fuel;

const total =
Math.round(oneCar * carCount);

const perPerson =
Math.round(total / participants);

let html = `
<div class="result">
総配車代：${total.toLocaleString()}円
</div>

<div>
参加人数：${participants}人
</div>

<div>
1人あたり：${perPerson}円
</div>

<hr>
`;

db.families.forEach(f=>{
html += `
<div>
${f.name}
：
${(perPerson*f.members).toLocaleString()}円
</div>
`;
});

document.getElementById("result").innerHTML = html;

document.getElementById("parentView").innerHTML = `
<h3>${tripName}</h3>
${html}
`;

window.lastCalculation = {
tripName,
perPerson
};
}

function generateLineText(){

if(!window.lastCalculation){
alert("先に計算してください");
return;
}

const text =
`${window.lastCalculation.tripName}

1人あたり負担額
${window.lastCalculation.perPerson}円

詳細はこちら
${location.href}`;

document.getElementById("lineText").value = text;
}

function exportJson(){

const blob = new Blob(
[JSON.stringify(db,null,2)],
{type:"application/json"}
);

const url =
URL.createObjectURL(blob);

const a =
document.createElement("a");

a.href=url;
a.download="backup.json";
a.click();
}

function importJson(event){

const file = event.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = () => {

db = JSON.parse(reader.result);

save();

alert("復元完了");
};

reader.readAsText(file);
}

renderFamilies();

</script>

</body>
</html>
