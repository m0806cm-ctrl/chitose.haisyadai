<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千年ドルフィンズ女子 配車代管理システム</title>

<style>

:root{
--main:#0b3d91;
--green:#2e7d32;
--red:#c62828;
--bg:#f4f6f8;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
}

header{
background:var(--main);
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
z-index:10;
}

.container{
padding:15px;
padding-bottom:120px;
max-width:900px;
margin:auto;
}

.card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input,
select,
textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
border:none;
border-radius:8px;
padding:10px 15px;
margin:3px;
cursor:pointer;
font-size:15px;
}

.primary{
background:var(--main);
color:#fff;
}

.green{
background:var(--green);
color:#fff;
}

.red{
background:var(--red);
color:#fff;
}

.gray{
background:#666;
color:#fff;
}

.hidden{
display:none;
}

.title{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.col{
flex:1;
min-width:200px;
}

.table{
width:100%;
border-collapse:collapse;
}

.table th,
.table td{
border:1px solid #ddd;
padding:8px;
font-size:14px;
}

.badge{
padding:5px 10px;
border-radius:20px;
color:#fff;
font-size:12px;
}

.success{
background:#2e7d32;
}

.warning{
background:#ef6c00;
}

.danger{
background:#c62828;
}

@media(max-width:768px){

.row{
flex-direction:column;
}

button{
width:100%;
}

}

</style>
</head>

"現在の管理者パスワードを入力してください"
);

await getDoc(
doc(db,"settings","passwords")
);

const settings =
settingsDoc.data();

currentPass !==
settings.adminPassword
){

return;
}

let adminPass =
document.getElementById(
"changeAdminPass"
).value.trim();

let accountPass =
document.getElementById(
"changeAccountPass"
).value.trim();

!adminPass &&
!accountPass
){
alert("入力してください");
return;
}

await setDoc(
doc(db,"settings","passwords"),
{

);

  await addDoc(collection(db, "familyMaster"), {
    name,
    createdAt: Date.now()
  });

  document.getElementById("familyMasterName").value = "";
}

function calculateTournament(){

let distance=
Number(
document.getElementById(
"distance"
).value
);

let gasPrice=
Number(
document.getElementById(
"gasPrice"
).value
);

let fuelRate=
Number(
document.getElementById(
"fuelRate"
).value
);

let carCount=
Number(
document.getElementById(
"carCount"
).value
);
/* 入力チェック */

if(
!document.getElementById(
"tournamentName"
).value.trim()
){
alert("大会名を入力してください");
return;
}

if(distance <= 0){
alert("距離を入力してください");
return;
}

if(gasPrice <= 0){
alert("ガソリン単価を入力してください");
return;
}

if(fuelRate <= 0){
alert("燃費を入力してください");
return;
}

if(carCount <= 0){
alert("配車台数を入力してください");
return;
}
let totalCost=
Math.ceil(
(distance/fuelRate)
*gasPrice
*carCount
);

let totalPeople=0;

let families=[];
familyMaster.forEach((f,i)=>{

let people = safeNum(document.getElementById(`people_${i}`).value);

let driver =
document.getElementById(`driver_${i}`).checked;

if(people > 0){

let chargePeople =
driver
? Math.max(people - 1, 0)
: people;

totalPeople += chargePeople;



families.push({
name:f.name,
people:people,
driver:driver,
chargePeople:chargePeople
});

}

}); // ← ここでforEach終了（これだけでOK）

if(totalPeople===0){
alert("参加家庭を入力してください");
return;
}

let perPersonCost =
Math.ceil(totalCost / totalPeople);

families.forEach(f => {

f.charge =
f.chargePeople * perPersonCost;

f.receive =
f.driver
? Math.round(totalCost / carCount)
: 0;

f.balance =
f.receive - f.charge;

});

let resultHtml = `
<div class="card">
<div class="title">計算結果</div>

<div>総費用：${totalCost}円</div>
<div>対象人数：${totalPeople}人</div>
<div>1人あたり：${perPersonCost}円</div>
</div>

<div class="card">
<div class="title">家庭別内訳</div>
`;

families.forEach(f => {

let charge =
f.chargePeople * perPersonCost;

let receive =
f.driver
? Math.round(totalCost / carCount)
: 0;

let diff =
receive - charge;

resultHtml += `
<div class="card">
<b>${f.name}</b><br>
人数：${f.people}人<br>
配車：${f.driver ? "あり" : "なし"}<br>
請求対象：${f.chargePeople}人<br>
請求額：${charge}円<br>
受取額：${Math.round(receive)}円<br>
差額：${Math.round(diff)}円
</div>
`;
});

document.getElementById("resultArea").innerHTML = resultHtml;

// 一時保存
window.lastCalc = {
totalCost,
perPersonCost,
families
};
}

function saveTournament() {

if (!window.lastCalc) {
alert("先に計算してください");
return;
}

let imageFile =
document.getElementById(
"routeImage"
).files[0];

if(imageFile){

let reader =
new FileReader();

reader.onload = function(e){

saveTournamentData(
e.target.result
);

};

reader.readAsDataURL(
imageFile
);

}else{

saveTournamentData("");

}

}

async function saveTournamentData(imageData) {

  let tournament = {
    name: document.getElementById("tournamentName").value,
    date: document.getElementById("tournamentDate").value,
    distance: document.getElementById("distance").value,
    gasPrice: document.getElementById("gasPrice").value,
    fuelRate: document.getElementById("fuelRate").value,
    carCount: document.getElementById("carCount").value,
    routeImage: imageData,
    result: window.lastCalc,
    timestamp: Date.now()
  };

  await addDoc(collection(db, "tournaments"), tournament);

  alert("保存しました");
  refreshHistory();
}
function safeNum(v){
return isNaN(Number(v)) ? 0 : Number(v);
}
function refreshHistory() {

let sel = document.getElementById("historySelect");
if (!sel) return;

sel.innerHTML = `<option value="">大会選択</option>`;

tournaments.forEach((t, i) => {
sel.innerHTML += `
<option value="${i}">
${t.name || "無題"}（${t.date || ""}）
</option>
`;
});

let viewerSel = document.getElementById("viewerTournament");
if (viewerSel) {
viewerSel.innerHTML = `<option value="">大会選択</option>`;

tournaments.forEach((t, i) => {
viewerSel.innerHTML += `
<option value="${i}">
${t.name || "無題"}（${t.date || ""}）
</option>
`;
});
}
}

function loadHistory() {

let i = document.getElementById("historySelect").value;

if (i === "") {
document.getElementById("historyInfo").innerHTML = "";
return;
}

let t = tournaments[i];

let html = `
<div class="card">
<div class="title">${t.name}</div>
<div>日付：${t.date}</div>
<div>距離：${t.distance}km</div>
<div>総費用：${t.result.totalCost}円</div>
<div>1人あたり：${t.result.perPersonCost}円</div>

${t.routeImage ?
`<img
src="${t.routeImage}"
style="
width:100%;
margin-top:10px;
border-radius:10px;
">`
: ""}

</div>
`;

t.result.families.forEach(f => {

let charge =
(f.charge !== undefined)
? f.charge
: f.chargePeople * t.result.perPersonCost;

let receive =
(f.receive !== undefined)
? f.receive
: (f.driver
? Math.round(t.result.totalCost / Number(t.carCount || 1))
: 0);

let balance =
(f.balance !== undefined)
? f.balance
: receive - charge;

html += `
<div class="card">
<b>${f.name}</b><br>
人数：${f.people}人<br>
配車：${f.driver ? "あり" : "なし"}<br>
請求額：${charge}円<br>
受取額：${receive}円<br>
差額：
<span style="
font-weight:bold;
color:${balance >= 0 ? '#2e7d32' : '#c62828'};
">
${balance > 0 ? '+' : ''}${balance}円
</span>
</div>
`;
});

document.getElementById("historyInfo").innerHTML = html;
}

async function exportJSON() {

const familySnap =
await getDocs(collection(db,"familyMaster"));

const tournamentSnap =
await getDocs(collection(db,"tournaments"));

const data = {

familyMaster:
familySnap.docs.map(d=>({
id:d.id,
...d.data()
})),

tournaments:
tournamentSnap.docs.map(d=>({
id:d.id,
...d.data()
}))

};

let blob = new Blob(
[JSON.stringify(data,null,2)],
{type:"application/json"}
);

let a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

let today =
new Date()
.toISOString()
.slice(0,10);

a.download =
`backup_${today}.json`;

a.click();

localStorage.setItem(
"lastBackupDate",
new Date().toISOString()
);

showBackupInfo();

alert("バックアップを保存しました");
}
async function deleteTournament() {

  let i =
    document.getElementById(
      "historySelect"
    ).value;

  if (i === "")
    return alert("大会を選択してください");

  let t = tournaments[i];

  if (!confirm("この大会を削除しますか？"))
    return;

  await deleteDoc(
    doc(db, "tournaments", t.id)
  );

  document.getElementById(
    "historyInfo"
  ).innerHTML = "";

  refreshHistory();

  alert("削除しました");
}

  function showBackupInfo(){

let d =
localStorage.getItem(
"lastBackupDate"
);

let el =
document.getElementById(
"backupInfo"
);

if(!el) return;

if(!d){

el.innerHTML =
"バックアップ未実施";

return;

}

let displayDate =
new Date(d).toLocaleDateString("ja-JP");

el.innerHTML =
"最終バックアップ日：" +
displayDate;

/* 30日警告 */

let last =
new Date(d);

let diff =
Math.floor(
(Date.now() - last.getTime())
/ 86400000
);

if(diff > 30){

el.innerHTML +=
"<br><span style='color:red'>⚠ 30日以上バックアップなし</span>";

}

}
async function importJSON(event) {

let file = event.target.files[0];

if(!file) return;

let text = await file.text();
let data = JSON.parse(text);

if(
!confirm(
"⚠ 現在の全データを削除します。\n復元後は元に戻せません。\n続行しますか？"
)
){
return;
}

/* ===== familyMaster全削除 ===== */

const familySnap =
await getDocs(
collection(db,"familyMaster")
);

for(const d of familySnap.docs){

await deleteDoc(
doc(db,"familyMaster",d.id)
);

}

/* ===== tournaments全削除 ===== */

const tournamentSnap =
await getDocs(
collection(db,"tournaments")
);

for(const d of tournamentSnap.docs){

await deleteDoc(
doc(db,"tournaments",d.id)
);

}

/* ===== familyMaster復元 ===== */

for(const f of (data.familyMaster || [])){

await addDoc(
collection(db,"familyMaster"),
{
name:f.name,
createdAt:
f.createdAt || Date.now()
}
);

}

/* ===== tournaments復元 ===== */

for(const t of (data.tournaments || [])){

await addDoc(
collection(db,"tournaments"),
{
name:t.name,
date:t.date,
distance:t.distance,
gasPrice:t.gasPrice,
fuelRate:t.fuelRate,
carCount:t.carCount,
routeImage:t.routeImage || "",
result:t.result,
timestamp:
t.timestamp || Date.now()
}
);

}

alert("バックアップから完全復元しました");

}
