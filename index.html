<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部活配車代管理 v3.2</title>

<style>
body{margin:0;font-family:Arial;background:#f4f6f8;color:#333;}
header{background:#1976d2;color:#fff;padding:12px;text-align:center;font-weight:bold;}
.container{padding:10px;padding-bottom:80px;}
.card{background:#fff;border-radius:10px;padding:10px;margin:10px 0;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;}
button{padding:10px;margin:5px;border:none;border-radius:8px;font-size:14px;}
.primary{background:#1976d2;color:#fff;}
.green{background:#43a047;color:#fff;}
.red{background:#e53935;color:#fff;}
.gray{background:#777;color:#fff;}
.tab{display:none;}
.tab.active{display:block;}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ccc;}
.nav button{flex:1;margin:0;border-radius:0;}
.small{font-size:12px;color:#666;}
hr{border:none;border-top:1px solid #eee;margin:8px 0;}
</style>
</head>

<body>

<header>配車代管理システム v3.2</header>

<div class="container">

<!-- SETUP -->
<div id="setup" class="tab">
<h3>初期設定</h3>
<input id="adminPass1" type="password" placeholder="管理者パスワード">
<input id="adminPass2" type="password" placeholder="確認">
<button class="primary" onclick="initAdmin()">保存</button>
</div>

<!-- LOGIN -->
<div id="login" class="tab">
<h3>ログイン</h3>
<input id="pass" type="password" placeholder="パスワード">
<button class="primary" onclick="login('admin')">管理者</button>
<button class="green" onclick="login('account')">会計</button>
<button onclick="guest()">保護者</button>
</div>

<!-- ADMIN -->
<div id="admin" class="tab">

<div class="card">
<h3>家庭マスタ</h3>
<input id="famName" placeholder="苗字">
<button class="primary" onclick="addFamily()">追加</button>
<div id="famList"></div>
</div>

<div class="card">
<h3>会計アカウント</h3>
<input id="accName" placeholder="名前">
<input id="accPass" placeholder="パスワード">
<button class="primary" onclick="addAcc()">追加</button>
<div id="accList"></div>
</div>

<div class="card">
<h3>バックアップ</h3>
<button onclick="exportData()">JSON出力</button>
<input type="file" onchange="importData(event)">
</div>

</div>

<!-- ACCOUNT -->
<div id="account" class="tab">

<div class="card">
<h3>遠征作成</h3>
<input id="tName" placeholder="遠征名">
<input id="tDate" type="date">
<input id="dist" placeholder="距離 km">
<input id="gas" placeholder="ガソリン単価">
<input id="fuel" placeholder="燃費 km/L">
<input id="cars" placeholder="配車台数">
<button class="primary" onclick="addTrip()">作成</button>
</div>

<div id="tripList"></div>

</div>

<!-- PARENT -->
<div id="parent" class="tab">
<h3>保護者閲覧</h3>
<div id="parentList"></div>
</div>

</div>

<div class="nav">
<button onclick="show('login')">ログイン</button>
<button onclick="show('admin')">管理</button>
<button onclick="show('account')">会計</button>
<button onclick="show('parent')">保護者</button>
</div>

<script>

let db = {
adminPass: localStorage.getItem("adminPass"),
families: JSON.parse(localStorage.getItem("families")||"[]"),
accounts: JSON.parse(localStorage.getItem("accounts")||"[]"),
trips: JSON.parse(localStorage.getItem("trips")||"[]")
};

function save(){
localStorage.setItem("adminPass",db.adminPass);
localStorage.setItem("families",JSON.stringify(db.families));
localStorage.setItem("accounts",JSON.stringify(db.accounts));
localStorage.setItem("trips",JSON.stringify(db.trips));
}

function show(id){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
render();
}

function init(){
db.adminPass ? show("login") : show("setup");
}
init();

/* ===== ADMIN ===== */

function initAdmin(){
let a=document.getElementById("adminPass1").value;
let b=document.getElementById("adminPass2").value;
if(a && a===b){
db.adminPass=a;save();show("login");
}
}

function login(type){
let p=document.getElementById("pass").value;
if(type==="admin" && p===db.adminPass) show("admin");
else if(type==="account") show("account");
}

function guest(){show("parent");}

function addFamily(){
db.families.push(document.getElementById("famName").value);
save();render();
}

function addAcc(){
db.accounts.push({
name:accName.value,
pass:accPass.value
});
save();render();
}

/* ===== TRIP ===== */

function addTrip(){

let families = db.families.map(f=>({
name:f,
people:1,
isCar:false,
collected:false
}));

db.trips.push({
name:tName.value,
date:tDate.value,
dist:+dist.value,
gas:+gas.value,
fuel:+fuel.value,
cars:+cars.value,
families
});

save();render();
}

/* ===== CALC ===== */

function calc(t){

let total = Math.ceil(((t.dist*t.gas/t.fuel)*t.cars)/10)*10;

let totalPeople = t.families.reduce((a,b)=>a+b.people,0);
let perPerson = Math.ceil(total / totalPeople);

let carShare = total / (t.cars || 1);

let result = t.families.map(f=>{
let burden = f.people * perPerson;
let diff = Math.round(carShare - burden);
return {...f, burden, diff};
});

return {total, perPerson, carShare, result};
}

/* ===== RENDER ===== */

function render(){

famList.innerHTML = db.families.map((f,i)=>
`<div>${f} <button onclick="db.families.splice(${i},1);save();render()">削除</button></div>`
).join("");

accList.innerHTML = db.accounts.map((a,i)=>
`<div>${a.name} <button onclick="db.accounts.splice(${i},1);save();render()">削除</button></div>`
).join("");

/* ACCOUNT */
tripList.innerHTML = db.trips.map((t,i)=>{
let c=calc(t);

let lines = c.result.map(r=>{
if(r.isCar){
let msg = r.diff>=0 ? `＋${r.diff}円受け取り` : `−${Math.abs(r.diff)}円支払い`;
return `<div><b>${r.name}</b>（配車）→ ${msg}</div>`;
}
return `<div>${r.name} 負担:${r.burden}円</div>`;
}).join("");

return `
<div class="card">
<b>${t.name}</b><br>
総額:${c.total}円 / 1人:${c.perPerson}円
<hr>
${lines}
<button class="red" onclick="db.trips.splice(${i},1);save();render()">削除</button>
<button class="green" onclick="share(${i})">LINE</button>
</div>`;
}).join("");

/* PARENT */
parentList.innerHTML = db.trips.map(t=>{
let c=calc(t);
return `
<div class="card">
<b>${t.name}</b><br>
総額:${c.total}円<br>
1人:${c.perPerson}円
</div>`;
}).join("");

}

/* ===== LINE ===== */

function share(i){
let t=db.trips[i];
let c=calc(t);

let txt =
`${t.name}\n総額 ${c.total}円\n1人 ${c.perPerson}円`;

let url="https://line.me/R/msg/text/?"+encodeURIComponent(txt);
window.open(url);
}

/* ===== BACKUP ===== */

function exportData(){
let b=new Blob([JSON.stringify(db)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(b);
a.download="backup.json";
a.click();
}

function importData(e){
let r=new FileReader();
r.onload=()=>{
db=JSON.parse(r.result);
save();render();
};
r.readAsText(e.target.files[0]);
}

</script>

</body>
</html>
