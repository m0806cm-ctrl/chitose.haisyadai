<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千年ドルフィンズ女子 配車代管理システム</title>

<style>

:root{
--main:#0b3d91;
--green:#2e7d32;
--red:#c62828;
--bg:#f4f6f8;
}

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
}

header{
background:var(--main);
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
position:sticky;
top:0;
z-index:10;
}

.container{
padding:15px;
padding-bottom:120px;
max-width:900px;
margin:auto;
}

.card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input,
select,
textarea{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
border:none;
border-radius:8px;
padding:10px 15px;
margin:3px;
cursor:pointer;
font-size:15px;
}

.primary{
background:var(--main);
color:#fff;
}

.green{
background:var(--green);
color:#fff;
}

.red{
background:var(--red);
color:#fff;
}

.gray{
background:#666;
color:#fff;
}

.hidden{
display:none;
}

.title{
font-size:18px;
font-weight:bold;
margin-bottom:10px;
}

.row{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.col{
flex:1;
min-width:200px;
}

.table{
width:100%;
border-collapse:collapse;
}

.table th,
.table td{
border:1px solid #ddd;
padding:8px;
font-size:14px;
}

.badge{
padding:5px 10px;
border-radius:20px;
color:#fff;
font-size:12px;
}

.success{
background:#2e7d32;
}

.warning{
background:#ef6c00;
}

.danger{
background:#c62828;
}

@media(max-width:768px){

.row{
flex-direction:column;
}

button{
width:100%;
}

}

</style>
</head>

<body>

<header>
千年ドルフィンズ女子 配車代管理システム
</header>

<div class="container">

<!-- ログイン -->

<div id="loginPage" class="card">

<div class="title">
ログイン
</div>

<select id="loginRole">

<option value="viewer">
保護者閲覧
</option>

<option value="accountant">
会計
</option>

<option value="admin">
管理者
</option>

</select>

<input
id="loginPassword"
type="password"
placeholder="パスワード">

<button
class="primary"
onclick="login()">
ログイン
</button>

</div>

<!-- 初回設定 -->

<div
id="setupPage"
class="card hidden">

<div class="title">
初回管理者設定
</div>

<label>
管理者パスワード
</label>

<input
id="newAdminPass"
type="password">

<label>
会計パスワード
</label>

<input
id="newAccountPass"
type="password">

<button
class="green"
onclick="saveInitialSetup()">
設定保存
</button>

</div>

<!-- メニュー -->

<div
id="menuArea"
class="hidden">

<div class="card">

<div id="roleText"></div>

<button
class="gray"
onclick="logout()">
ログアウト
</button>

</div>

<!-- 管理者 -->

<div
id="adminArea"
class="hidden">

<div class="card">

<div class="title">
家庭マスタ管理
</div>

<input
id="familyMasterName"
placeholder="家庭名">

<button
class="green"
onclick="addFamilyMaster()">
家庭追加
</button>

<div id="familyMasterList"></div>

</div>

<div class="card">

<div class="title">
バックアップ
</div>

<button
class="primary"
onclick="exportJSON()">
JSON保存
</button>

<input
type="file"
id="jsonRestore"
accept=".json"
onchange="importJSON(event)">
  
<div id="backupInfo"
style="
margin-top:10px;
font-weight:bold;
color:#0b3d91;
">
バックアップ未実施
</div>
</div> <!-- バックアップカード終了 -->

<div class="card">

<div class="title">
パスワード変更
</div>

<label>
新しい管理者パスワード
</label>

<input
id="changeAdminPass"
type="password">

<label>
新しい会計パスワード
</label>

<input
id="changeAccountPass"
type="password">

<button
class="green"
onclick="changePasswords()">
パスワード更新
</button>
</div>

</div>

<!-- 会計 -->

<div
id="accountArea"
class="hidden">

<div class="card">

<div class="title">
大会作成
</div>

<input
id="tournamentName"
placeholder="大会名">

<input
id="tournamentDate"
type="date">

<label>
距離(km)
</label>

<input
id="distance"
type="number"
value="0">

<label>
ガソリン単価
</label>

<input
id="gasPrice"
type="number"
value="180">

<label>
燃費(km/L)
</label>

<input
id="fuelRate"
type="number"
value="12">

<label>
配車台数
</label>

<input
id="carCount"
type="number"
value="1">

<label>
地図画像
</label>

<input
id="routeImage"
type="file"
accept="image/*">

</div>

<div class="card">

<div class="title">
参加家庭登録
</div>

<div id="familyCheckArea"></div>

</div>
<div class="card">

<button
class="primary"
onclick="calculateTournament()">
配車代計算
</button>

<button
class="green"
onclick="saveTournament()">
大会保存
</button>

<button
class="green"
onclick="shareLine()">
LINE共有
</button>

</div>

<div
id="resultArea">
</div>

<div class="card">

<div class="title">
大会履歴
</div>

<select
id="historySelect"
onchange="loadHistory()">

<option value="">
大会選択
</option>

</select>

<div id="historyInfo"></div>

<button
class="red"
onclick="deleteTournament()">
この大会を削除
</button>

</div>

</div>

<!-- 閲覧 -->

<div
id="viewerArea"
class="hidden">

<div class="card">

<div class="title">
保存済み大会
</div>

<select
id="viewerTournament"
onchange="viewerLoad()">

<option value="">
大会選択
</option>

</select>

</div>

<div id="viewerResult"></div>

</div>

</div>

</div>
<script>


let tournaments=
JSON.parse(
localStorage.getItem(
"tournaments"
)||"[]"
);

function init(){

if(!localStorage.getItem("adminPassword")){
document.getElementById("loginPage").classList.add("hidden");
document.getElementById("setupPage").classList.remove("hidden");
}

// DOM確実化（重要）
setTimeout(() => {
refreshHistory();
}, 0);

}



function saveInitialSetup(){

localStorage.setItem(
"adminPassword",
document.getElementById(
"newAdminPass"
).value
);

localStorage.setItem(
"accountPassword",
document.getElementById(
"newAccountPass"
).value
);

alert(
"設定完了"
);

location.reload();

}

function login(){

let role=
document.getElementById(
"loginRole"
).value;

let pass=
document.getElementById(
"loginPassword"
).value;

if(role==="viewer"){

showViewer();

return;

}

if(
role==="admin" &&
pass===
localStorage.getItem(
"adminPassword"
)
){

showAdmin();

return;

}

if(
role==="accountant" &&
pass===
localStorage.getItem(
"accountPassword"
)
){

showAccount();

return;

}

alert(
"ログイン失敗"
);

}

function logout(){

location.reload();

}
function changePasswords(){

let currentPass =
prompt(
"現在の管理者パスワードを入力してください"
);

if(
currentPass !==
localStorage.getItem(
"adminPassword"
)
){
alert("認証失敗");
return;
}

let adminPass =
document.getElementById(
"changeAdminPass"
).value.trim();

let accountPass =
document.getElementById(
"changeAccountPass"
).value.trim();

if(
!adminPass &&
!accountPass
){
alert("入力してください");
return;
}

if(adminPass){

localStorage.setItem(
"adminPassword",
adminPass
);

}

if(accountPass){

localStorage.setItem(
"accountPassword",
accountPass
);

}

alert(
"パスワードを更新しました"
);

document.getElementById(
"changeAdminPass"
).value = "";

document.getElementById(
"changeAccountPass"
).value = "";

}

function showAdmin(){

document
.getElementById(
"loginPage"
)
.classList.add(
"hidden"
);

document
.getElementById(
"menuArea"
)
.classList.remove(
"hidden"
);

document
.getElementById(
"adminArea"
)
.classList.remove(
"hidden"
);

document
.getElementById(
"roleText"
)
.innerHTML=
"管理者";

renderFamilyMaster();

showBackupInfo();
}

function showAccount(){

document
.getElementById(
"loginPage"
)
.classList.add(
"hidden"
);

document
.getElementById(
"menuArea"
)
.classList.remove(
"hidden"
);

document
.getElementById(
"accountArea"
)
.classList.remove(
"hidden"
);

document
.getElementById(
"roleText"
)
.innerHTML=
"会計";

renderFamilySelection();

}

function showViewer(){

document.getElementById("loginPage").classList.add("hidden");

document.getElementById("menuArea").classList.remove("hidden");

document.getElementById("viewerArea").classList.remove("hidden");

document.getElementById("roleText").innerHTML = "保護者閲覧";

refreshViewer();

}

function refreshViewer() {

let sel = document.getElementById("viewerTournament");
if (!sel) return;

sel.innerHTML = `<option value="">大会選択</option>`;

tournaments.forEach((t, i) => {
sel.innerHTML += `
<option value="${i}">
${t.name || "無題"}（${t.date || ""}）
</option>
`;
});
}
function addFamilyMaster(){

let name=
document.getElementById(
"familyMasterName"
).value.trim();

if(!name)return;

familyMaster.push({
name:name
});

localStorage.setItem(
"familyMaster",
JSON.stringify(
familyMaster
)
);

document.getElementById(
"familyMasterName"
).value="";

renderFamilyMaster();

}

function renderFamilyMaster(){

let html="";

familyMaster.forEach(
(f,i)=>{

html+=`

<div class="card">

${f.name}

<button
class="red"
onclick="deleteFamilyMaster(${i})">
削除
</button>

</div>

`;

});

document.getElementById(
"familyMasterList"
).innerHTML=
html;

}

function deleteFamilyMaster(i){

familyMaster.splice(i,1);

localStorage.setItem(
"familyMaster",
JSON.stringify(
familyMaster
)
);

renderFamilyMaster();

}

function renderFamilySelection(){

let html="";

familyMaster.forEach(
(f,i)=>{

html+=`

<div class="card">

<b>${f.name}</b>

<label>
参加人数
</label>

<input
type="number"
min="0"
value="0"
id="people_${i}">

<label>

<input
type="checkbox"
id="driver_${i}">

配車家庭

</label>

</div>

`;

});

document.getElementById(
"familyCheckArea"
).innerHTML=
html;

}

function calculateTournament(){

let distance=
Number(
document.getElementById(
"distance"
).value
);

let gasPrice=
Number(
document.getElementById(
"gasPrice"
).value
);

let fuelRate=
Number(
document.getElementById(
"fuelRate"
).value
);

let carCount=
Number(
document.getElementById(
"carCount"
).value
);

let totalCost=
Math.ceil(
(distance/fuelRate)
*gasPrice
*carCount
);

let totalPeople=0;

let families=[];
familyMaster.forEach((f,i)=>{

let people = safeNum(document.getElementById(`people_${i}`).value);

let driver =
document.getElementById(`driver_${i}`).checked;

if(people > 0){

let chargePeople =
driver
? Math.max(people - 1, 0)
: people;

totalPeople += chargePeople;



families.push({
name:f.name,
people:people,
driver:driver,
chargePeople:chargePeople
});

}

}); // ← ここでforEach終了（これだけでOK）

let perPersonCost =
totalPeople > 0
? Math.ceil(totalCost / totalPeople)
: 0;

families.forEach(f => {

f.charge =
f.chargePeople * perPersonCost;

f.receive =
f.driver
? Math.round(totalCost / carCount)
: 0;

f.balance =
f.receive - f.charge;

});

let resultHtml = `
<div class="card">
<div class="title">計算結果</div>

<div>総費用：${totalCost}円</div>
<div>対象人数：${totalPeople}人</div>
<div>1人あたり：${perPersonCost}円</div>
</div>

<div class="card">
<div class="title">家庭別内訳</div>
`;

families.forEach(f => {

let charge =
f.chargePeople * perPersonCost;

let receive =
f.driver
? Math.round(totalCost / carCount)
: 0;

let diff =
receive - charge;

resultHtml += `
<div class="card">
<b>${f.name}</b><br>
人数：${f.people}人<br>
配車：${f.driver ? "あり" : "なし"}<br>
請求対象：${f.chargePeople}人<br>
請求額：${charge}円<br>
受取額：${Math.round(receive)}円<br>
差額：${Math.round(diff)}円
</div>
`;
});

document.getElementById("resultArea").innerHTML = resultHtml;

// 一時保存
window.lastCalc = {
totalCost,
perPersonCost,
families
};
}

function saveTournament() {

if (!window.lastCalc) {
alert("先に計算してください");
return;
}

let imageFile =
document.getElementById(
"routeImage"
).files[0];

if(imageFile){

let reader =
new FileReader();

reader.onload = function(e){

saveTournamentData(
e.target.result
);

};

reader.readAsDataURL(
imageFile
);

}else{

saveTournamentData("");

}

}

async function saveTournamentData(
imageData
){

let tournament = {

name:
document.getElementById(
"tournamentName"
).value,

date:
document.getElementById(
"tournamentDate"
).value,

distance:
document.getElementById(
"distance"
).value,

gasPrice:
document.getElementById(
"gasPrice"
).value,

fuelRate:
document.getElementById(
"fuelRate"
).value,

carCount:
document.getElementById(
"carCount"
).value,

routeImage:
imageData,

result:
window.lastCalc,

timestamp:
Date.now()

};

tournaments.push(
tournament
);

localStorage.setItem(
"tournaments",
JSON.stringify(
tournaments
)
);

alert(
"保存しました"
);

refreshHistory();
function safeNum(v){
return isNaN(Number(v)) ? 0 : Number(v);
}
function refreshHistory() {

let sel = document.getElementById("historySelect");
if (!sel) return;

sel.innerHTML = `<option value="">大会選択</option>`;

tournaments.forEach((t, i) => {
sel.innerHTML += `
<option value="${i}">
${t.name || "無題"}（${t.date || ""}）
</option>
`;
});

let viewerSel = document.getElementById("viewerTournament");
if (viewerSel) {
viewerSel.innerHTML = `<option value="">大会選択</option>`;

tournaments.forEach((t, i) => {
viewerSel.innerHTML += `
<option value="${i}">
${t.name || "無題"}（${t.date || ""}）
</option>
`;
});
}
}

function loadHistory() {

let i = document.getElementById("historySelect").value;

if (i === "") {
document.getElementById("historyInfo").innerHTML = "";
return;
}

let t = tournaments[i];

let html = `
<div class="card">
<div class="title">${t.name}</div>
<div>日付：${t.date}</div>
<div>距離：${t.distance}km</div>
<div>総費用：${t.result.totalCost}円</div>
<div>1人あたり：${t.result.perPersonCost}円</div>

${t.routeImage ?
`<img
src="${t.routeImage}"
style="
width:100%;
margin-top:10px;
border-radius:10px;
">`
: ""}

</div>
`;

t.result.families.forEach(f => {

let charge =
(f.charge !== undefined)
? f.charge
: f.chargePeople * t.result.perPersonCost;

let receive =
(f.receive !== undefined)
? f.receive
: (f.driver
? Math.round(t.result.totalCost / Number(t.carCount || 1))
: 0);

let balance =
(f.balance !== undefined)
? f.balance
: receive - charge;

html += `
<div class="card">
<b>${f.name}</b><br>
人数：${f.people}人<br>
配車：${f.driver ? "あり" : "なし"}<br>
請求額：${charge}円<br>
受取額：${receive}円<br>
差額：
<span style="
font-weight:bold;
color:${balance >= 0 ? '#2e7d32' : '#c62828'};
">
${balance > 0 ? '+' : ''}${balance}円
</span>
</div>
`;
});

document.getElementById("historyInfo").innerHTML = html;
}

function viewerLoad() {

let i = document.getElementById("viewerTournament").value;

if (i === "") {
document.getElementById("viewerResult").innerHTML =
"<div class='card'>大会を選択してください</div>";
return;
}

let t = tournaments[i];

let html = `
<div class="card">
<div class="title">${t.name}</div>
<div>日付：${t.date}</div>
<div>総費用：${t.result.totalCost}円</div>
<div>1人あたり：${t.result.perPersonCost}円</div>

${t.routeImage ?
`<img
src="${t.routeImage}"
style="
width:100%;
margin-top:10px;
border-radius:10px;
">`
: ""}

</div>
`;

t.result.families.forEach(f => {

let charge =
(f.charge !== undefined)
? f.charge
: f.chargePeople * t.result.perPersonCost;

let receive =
(f.receive !== undefined)
? f.receive
: (f.driver
? Math.round(t.result.totalCost / Number(t.carCount || 1))
: 0);

let balance =
(f.balance !== undefined)
? f.balance
: receive - charge;

html += `
<div class="card">
<b>${f.name}</b><br>
人数：${f.people}人<br>
配車：${f.driver ? "あり" : "なし"}<br>
請求額：${charge}円<br>
受取額：${receive}円<br>
差額：${balance > 0 ? "+" : ""}${balance}円
</div>
`;
});

document.getElementById("viewerResult").innerHTML = html;
}
function exportJSON() {

let data = {
familyMaster,
tournaments
};

let blob = new Blob(
[JSON.stringify(data, null, 2)],
{ type: "application/json" }
);

let a = document.createElement("a");

a.href =
URL.createObjectURL(blob);

let today =
new Date()
.toISOString()
.slice(0,10);

a.download =
`backup_${today}.json`;

a.click();

/* バックアップ日保存 */

localStorage.setItem(
"lastBackupDate",
new Date().toISOString()
);

showBackupInfo();

alert(
"バックアップを保存しました"
);

}
function deleteTournament() {

let i =
document.getElementById(
"historySelect"
).value;

if(i===""){
alert("大会を選択してください");
return;
}

if(
!confirm(
"この大会を削除しますか？"
)
){
return;
}

tournaments.splice(
Number(i),
1
);

localStorage.setItem(
"tournaments",
JSON.stringify(
tournaments
)
);

document.getElementById(
"historyInfo"
).innerHTML = "";

refreshHistory();

alert("削除しました");

}
  function showBackupInfo(){

let d =
localStorage.getItem(
"lastBackupDate"
);

let el =
document.getElementById(
"backupInfo"
);

if(!el) return;

if(!d){

el.innerHTML =
"バックアップ未実施";

return;

}

let displayDate =
new Date(d).toLocaleDateString("ja-JP");

el.innerHTML =
"最終バックアップ日：" +
displayDate;

/* 30日警告 */

let last =
new Date(d);

let diff =
Math.floor(
(Date.now() - last.getTime())
/ 86400000
);

if(diff > 30){

el.innerHTML +=
"<br><span style='color:red'>⚠ 30日以上バックアップなし</span>";

}

}
function importJSON(event) {

let file = event.target.files[0];
let reader = new FileReader();

reader.onload = function (e) {
let data = JSON.parse(e.target.result);

familyMaster = data.familyMaster || [];
tournaments = data.tournaments || [];

localStorage.setItem("familyMaster", JSON.stringify(familyMaster));
localStorage.setItem("tournaments", JSON.stringify(tournaments));

alert("復元しました");
location.reload();
};

reader.readAsText(file);
}
function shareLine() {

if (!window.lastCalc) {
alert("先に計算してください");
return;
}

let t = window.lastCalc;

let tournamentName =
document.getElementById("tournamentName").value || "大会";

let tournamentDate =
document.getElementById("tournamentDate").value || "";

let carCount =
document.getElementById("carCount").value || 0;

let text =

`【${tournamentName}】\n\n` +

`日付：${tournamentDate}\n` +
`総費用：${t.totalCost}円\n` +
`配車台数：${carCount}台\n\n` +

`詳細はこちら\n` +
`https://m0806cm-ctrl.github.io/chitose.haisyadai/`;

let url =
"https://line.me/R/msg/text/?" +
encodeURIComponent(text);

window.open(url, "_blank");

}

init();
</script>

</body>
</html>
