<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>部活配車代管理システム</title>

<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f4f6f8}
.header{background:#1f4e79;color:#fff;padding:14px;text-align:center;font-weight:bold}

.tabs{display:flex;position:sticky;top:0;background:#fff}
.tab{flex:1;padding:12px;border:none;background:#fff}
.tab.active{background:#1f4e79;color:#fff}

.page{display:none;max-width:520px;margin:auto;padding:12px}
.page.active{display:block}

.card{background:#fff;padding:14px;border-radius:12px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.1)}

input{width:100%;padding:8px;margin:6px 0}

button{padding:10px;border:none;border-radius:6px;cursor:pointer}
.primary{background:#1f4e79;color:#fff;width:100%}
.small{padding:4px 8px;font-size:12px}

.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.badge{font-size:12px;padding:2px 6px;border-radius:6px;background:#eee}
.paid{color:green;font-weight:bold}
.unpaid{color:#d11}
textarea{width:100%;height:120px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid #ddd;text-align:left}
</style>
</head>

<body>

<div class="header">⚾ 配車代管理システム（現場版）</div>

<div class="tabs">
<button class="tab active" onclick="show('admin',this)">管理</button>
<button class="tab" onclick="show('accounting',this)">会計</button>
<button class="tab" onclick="show('parent',this)">保護者</button>
</div>

<!-- 管理 -->
<div id="admin" class="page active">
<div class="card">
<h3>家庭マスタ</h3>

<input id="name" placeholder="苗字">
<button class="primary" onclick="addFamily()">追加</button>

<div id="familyList"></div>
</div>
</div>

<!-- 会計 -->
<div id="accounting" class="page">

<div class="card">
<h3>遠征情報</h3>

<input id="tripName" placeholder="遠征名">
<input id="distance" type="number" placeholder="距離(km)">
<input id="gas" type="number" placeholder="ガソリン単価">
<input id="fuel" type="number" placeholder="燃費(km/L)">
<input id="carCount" type="number" placeholder="配車台数" value="1">
<input id="participants" type="number" placeholder="参加人数（当日入力）">

<button class="primary" onclick="calc()">計算</button>
</div>

<div class="card">
<h3>配車チェック</h3>
<div id="carList"></div>
</div>

<div class="card">
<h3>結果</h3>
<div id="result">未計算</div>
</div>

<div class="card">
<button class="primary" onclick="makeLine()">LINE共有</button>
<textarea id="line"></textarea>
</div>

</div>

<!-- 保護者 -->
<div id="parent" class="page">
<div class="card" id="parentView">未計算</div>
</div>

<script>

let db = JSON.parse(localStorage.getItem("car-db") || '{"families":[]}');
let last = null;

function save(){
localStorage.setItem("car-db",JSON.stringify(db));
render();
}

function addFamily(){
const name=document.getElementById("name").value.trim();
if(!name)return alert("入力");

db.families.push({
id:Date.now(),
name,
car:false,
paid:false
});

document.getElementById("name").value="";
save();
}

function deleteFamily(id){
if(!confirm("削除しますか？"))return;
db.families=db.families.filter(f=>f.id!==id);
save();
}

function toggleCar(id){
db.families=db.families.map(f=>{
if(f.id===id) f.car=!f.car;
return f;
});
save();
}

function togglePaid(id){
db.families=db.families.map(f=>{
if(f.id===id) f.paid=!f.paid;
return f;
});
save();
}

function calc(){

const tripName=document.getElementById("tripName").value;
const distance=Number(document.getElementById("distance").value);
const gas=Number(document.getElementById("gas").value);
const fuel=Number(document.getElementById("fuel").value);
const carCount=Number(document.getElementById("carCount").value);
const participants=Number(document.getElementById("participants").value);

if(!tripName||distance<=0||gas<=0||fuel<=0||carCount<=0||participants<=0){
alert("入力エラー");
return;
}

let total=(distance*gas)/fuel;
total*=carCount;
total=Math.ceil(total/10)*10;

const per=Math.ceil(total/participants);

const activeCars=db.families.filter(f=>f.car);

last={
tripName,total,per,participants
};

document.getElementById("result").innerHTML=`
<h3>${tripName}</h3>
<div>総額：${total}円</div>
<div>1人あたり：${per}円</div>
<div>参加人数：${participants}</div>
`;

document.getElementById("parentView").innerHTML=
db.families.map(f=>`
<div>
${f.name}：${f.paid?"支払い済":per+"円"}
</div>
`).join("");
}

function makeLine(){
if(!last)return alert("未計算");

document.getElementById("line").value=
`${last.tripName}

1人あたり：${last.per}円
参加人数：${last.participants}

このURL：
${location.href}`;
}

function render(){

document.getElementById("familyList").innerHTML=
db.families.map(f=>`
<div class="row">
<span>${f.name}</span>
<div>
<button class="small" onclick="toggleCar(${f.id})">
${f.car?"🚗":"未"}
</button>
<button class="small" onclick="togglePaid(${f.id})">
${f.paid?"済":"未"}
</button>
<button class="small" onclick="deleteFamily(${f.id})">削除</button>
</div>
</div>
`).join("");

document.getElementById("carList").innerHTML=
db.families.map(f=>`
<label>
<input type="checkbox" ${f.car?"checked":""} onclick="toggleCar(${f.id})">
${f.name}
</label>
`).join("");
}

function show(id,btn){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
document.getElementById(id).classList.add("active");
btn.classList.add("active");
}

render();

</script>

</body>
</html>
