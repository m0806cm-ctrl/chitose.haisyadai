<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>千年ドルフィンズ女子 配車代管理 v6.0</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f4f6f8;
}

header{
background:#0b3d91;
color:#fff;
padding:15px;
text-align:center;
font-weight:bold;
font-size:20px;
}

.container{
padding:10px;
padding-bottom:80px;
}

.card{
background:#fff;
padding:12px;
margin-bottom:12px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

input{
width:100%;
padding:10px;
margin:5px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
padding:10px;
border:none;
border-radius:8px;
margin:3px;
cursor:pointer;
}

.primary{
background:#0b3d91;
color:white;
}

.green{
background:#2e7d32;
color:white;
}

.red{
background:#c62828;
color:white;
}

.tab{
display:none;
}

.tab.active{
display:block;
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
background:white;
border-top:1px solid #ccc;
}

.nav button{
flex:1;
border-radius:0;
}

</style>
</head>

<body>

<header>
千年ドルフィンズ女子
配車代管理システム v6.0
</header>

<div class="container">

<div id="setup" class="tab">
<div class="card">

<h3>初回設定</h3>

<input id="adminPass1" type="password" placeholder="管理者パスワード">

<input id="adminPass2" type="password" placeholder="確認">

<input id="recoveryCode" placeholder="復旧コード">

<button class="primary" onclick="saveFirstSetup()">
保存
</button>

</div>
</div>

<div id="login" class="tab">

<div class="card">

<h3>ログイン</h3>

<input id="loginPass" type="password" placeholder="パスワード">

<button class="primary" onclick="loginAdmin()">
管理者
</button>

<button class="green" onclick="showTab('account')">
会計
</button>

<button onclick="showTab('parent')">
保護者
</button>

</div>

</div>
<div id="admin" class="tab">

<div class="card">

<h3>家庭マスタ</h3>

<input id="familyName" placeholder="苗字">

<button class="primary" onclick="addFamily()">
追加
</button>

<div id="familyList"></div>

</div>

<div class="card">

<h3>会計担当管理</h3>

<input id="accountName" placeholder="名前">

<input id="accountPass" placeholder="パスワード">

<button class="green" onclick="addAccount()">
追加
</button>

<div id="accountList"></div>

</div>

</div>

<div id="account" class="tab">

<div class="card">

<h3>遠征作成</h3>

<input id="tripName" placeholder="遠征名">

<input id="tripDate" type="date">

<input id="tripCost" type="number" placeholder="総配車代">
<input id="driverReward"
type="number"
placeholder="運転手報酬（1台）">
<button class="primary" onclick="addTrip()">
遠征作成
</button>

</div>

<div id="tripList"></div>

</div>





<div id="parent" class="tab">
<div class="card">
<h3>保護者ページ</h3>
<p>作成中</p>
</div>
</div>

</div>

<div class="nav">
<button onclick="showTab('login')">ログイン</button>
<button onclick="showTab('admin')">管理</button>
<button onclick="showTab('account')">会計</button>
<button onclick="showTab('parent')">保護者</button>
</div>

<script>

let db={

adminPass:localStorage.getItem("adminPass")||"",

recoveryCode:localStorage.getItem("recoveryCode")||"",

families:JSON.parse(
localStorage.getItem("families")||"[]"
),

accounts:JSON.parse(
localStorage.getItem("accounts")||"[]"
)
,

trips:JSON.parse(
localStorage.getItem("trips")||"[]"
)
};
function addTrip(){

let name =
document.getElementById("tripName").value;

let date =
document.getElementById("tripDate").value;

let cost =
Number(document.getElementById("tripCost").value);
let driverReward =
Number(
document.getElementById("driverReward").value
);
if(!name || !date || !cost){
    alert("遠征情報を入力してください");
    return;
}

let trip={

id:Date.now(),

name:name,

date:date,

cost:cost,
driverReward:driverReward,
participants:db.families.map(f=>({
name:f,
people:1,
isCar:false,
collected:false
}))

};

db.trips.push(trip);

saveDB();

renderTrips();

}
function editTrip(id){

let trip =
db.trips.find(t=>t.id===id);

if(!trip)return;

let html = "";

trip.participants.forEach((p,i)=>{

html += `
${p.name}

人数
<input type="number"
value="${p.people}"
onchange="
db.trips.find(t=>t.id===${id})
.participants[${i}].people=
Number(this.value);
saveDB();
">

<label>

<input type="checkbox"
${p.isCar ? "checked":""}
onchange="
db.trips.find(t=>t.id===${id})
.participants[${i}].isCar=
this.checked;
saveDB();
">

運転手

</label>

<hr>
`;

});

html += `
<button class="primary"
onclick="calculateTrip(${id})">
配車代計算
</button>

<div id="resultArea"></div>
`;

document.getElementById("tripList")
.innerHTML = html;

}
function calculateTrip(id){

let trip =
db.trips.find(t=>t.id===id);

if(!trip)return;

let totalPeople = 0;
let driverCount = 0;

trip.participants.forEach(p=>{

totalPeople += Number(p.people);

if(p.isCar){
driverCount++;
}

});

if(totalPeople===0){
alert("人数が0です");
return;
}

let totalReward =
driverCount * trip.driverReward;

let totalAmount =
trip.cost + totalReward;

let share =
Math.round(totalAmount / totalPeople);

let html = `
<h3>精算結果</h3>

総人数:${totalPeople}人<br>
運転手:${driverCount}台<br>
総配車代:${trip.cost}円<br>
運転手報酬総額:${totalReward}円<br>
1人あたり:${share}円
<hr>
`;

trip.participants.forEach(p=>{

let burden =
share * Number(p.people);

let reward =
p.isCar
? trip.driverReward
: 0;

let diff =
reward - burden;

html += `
<div class="card">

<b>${p.name}</b><br>

参加人数：
${p.people}人<br>

一人負担：
${share}円<br>

負担額：
${burden}円<br>

運転手報酬：
${reward}円<br>

<b>

${diff>=0
? "受取 "+diff+"円"
: "支払 "+Math.abs(diff)+"円"}

</b>

</div>
`;

});

document.getElementById(
"resultArea"
).innerHTML = html;

}
  function renderTrips(){

let area=
document.getElementById("tripList");

if(!area)return;

area.innerHTML=
db.trips.map(t=>`

<div class="card">

<b>${t.name}</b><br>
日付:${t.date}<br>
総配車代:${t.cost}円<br>
運転手報酬:${t.driverReward||0}円

<hr>

<button class="green"
onclick="editTrip(${t.id})">
参加者編集
</button>

</div>

`).join("");

}
function saveDB(){

localStorage.setItem(
"families",
JSON.stringify(db.families)
);

localStorage.setItem(
"accounts",
JSON.stringify(db.accounts)
);

localStorage.setItem(
"trips",
JSON.stringify(db.trips)
);

localStorage.setItem(
"adminPass",
db.adminPass
);

localStorage.setItem(
"recoveryCode",
db.recoveryCode
);

}
function showTab(id){

document
.querySelectorAll(".tab")
.forEach(x=>x.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

}

function saveFirstSetup(){

let p1=
document.getElementById("adminPass1").value;

let p2=
document.getElementById("adminPass2").value;

let r=
document.getElementById("recoveryCode").value;

if(!p1){
alert("パスワード入力");
return;
}

if(p1!==p2){
alert("確認不一致");
return;
}

db.adminPass=p1;
db.recoveryCode=r;

saveDB();

alert("保存しました");

showTab("login");

}

function loginAdmin(){

let p=
document.getElementById("loginPass").value;

if(p===db.adminPass){

showTab("admin");

}else{

alert("パスワードが違います");

}

}


function addFamily(){

let n=
document.getElementById("familyName").value;

if(!n)return;

db.families.push(n);

saveDB();

renderLists();

}

function deleteFamily(i){

db.families.splice(i,1);

saveDB();

renderLists();

}

function addAccount(){

let n=
document.getElementById("accountName").value;

let p=
document.getElementById("accountPass").value;

if(!n||!p)return;

db.accounts.push({
name:n,
pass:p
});

saveDB();

renderLists();

}

function deleteAccount(i){

db.accounts.splice(i,1);

saveDB();

renderLists();

}
function renderLists(){

    let fl = document.getElementById("familyList");

    if(fl){
        fl.innerHTML =
        db.families.map((f,i)=>`
            <div>
                ${f}
                <button class="red"
                    onclick="deleteFamily(${i})">
                    削除
                </button>
            </div>
        `).join("");
    }

    let al = document.getElementById("accountList");

    if(al){
        al.innerHTML =
        db.accounts.map((a,i)=>`
            <div>
                ${a.name}
                <button class="red"
                    onclick="deleteAccount(${i})">
                    削除
                </button>
            </div>
        `).join("");
    }
}

renderLists();
renderTrips();

if(!db.adminPass){
    showTab("setup");
}else{
    showTab("login");
}
</script>

</body>
</html>
